<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #FFFFFF;
      --blue: #69ACC2;
      --maroon: #60212E;
      --sand: #D8D1BD;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--maroon);
      color: var(--white);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
    }
    h1 {
      margin: 0 0 24px;
      font-family: "Archivo Black", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(3rem, 14vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .card {
      margin: 0 0 16px;
      padding: 28px 24px;
      min-height: 7.5em;
      border-radius: 20px;
      background: rgb(216 209 189 / 0.14);
      color: var(--sand);
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.45;
    }
    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      background: var(--blue);
      color: var(--maroon);
      font: 700 1.05rem "DM Sans", system-ui, sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 0 24px rgb(105 172 194 / 0.45);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover {
      box-shadow: 0 0 36px rgb(105 172 194 / 0.7);
    }
    button:active {
      transform: scale(0.98);
    }
    button:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <p class="card" id="message" aria-live="polite">A warm wind is drifting through, and the day feels wide open.</p>
    <button type="button" id="next">Say something else</button>
  </main>
  <script>
    const messages = [
      "A warm wind is drifting through, and the day feels wide open.",
      "Somewhere, a kettle is just about to boil.",
      "The best ideas usually arrive halfway through a walk.",
      "Today is a good day to start something small.",
      "There's a sunbeam out there with your name on it.",
      "Every big project began as a hello world.",
      "Take a breath. The coffee will wait.",
      "Someone nearby is about to laugh at their own joke."
    ];
    const message = document.getElementById("message");
    let current = 0;
    document.getElementById("next").addEventListener("click", () => {
      let next;
      do {
        next = Math.floor(Math.random() * messages.length);
      } while (next === current);
      current = next;
      message.textContent = messages[current];
    });
  </script>
</body>
</html>
