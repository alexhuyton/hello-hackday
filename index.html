<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root {
      --white: #FFFFFF;
      --blue: #69ACC2;
      --maroon: #60212E;
      --sand: #D8D1BD;
    }
    body {
      background: var(--sand);
      color: var(--maroon);
    }
    h1 {
      display: inline-block;
      background: var(--white);
      padding: 0.4em 0.8em;
      border-bottom: 6px solid var(--blue);
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>
